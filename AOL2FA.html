<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your identity - AOL</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='8' fill='%23000000'/%3E%3Ctext x='24' y='32' font-family='Arial, sans-serif' font-size='18' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EAOL%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1a1a1a;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px 32px 32px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: relative;
            min-height: 520px;
        }

        /* ---------- 2FA VIEW ---------- */
        .twofa-view.hidden {
            display: none;
        }

        .aol-logo {
            display: block;
            width: 88px;
            height: auto;
            margin: 0 auto 28px;
        }

        .heading {
            font-size: 24px;
            font-weight: 400;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 12px;
        }

        .subtext {
            font-size: 15px;
            line-height: 1.5;
            color: #4a4a4a;
            text-align: center;
            margin-bottom: 32px;
        }

        .subtext strong {
            color: #1a1a1a;
            font-weight: 600;
            word-break: break-all;
        }

        /* OTP input group */
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .otp-digit {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            font-family: inherit;
            color: #1a1a1a;
            background: #ffffff;
            border: 1px solid #b8b8b8;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
            caret-color: #000000;
        }

        .otp-digit::placeholder {
            color: #c0c0c0;
        }

        .otp-digit:hover {
            border-color: #7a7a7a;
        }

        .otp-digit:focus {
            border-color: #000000;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.12);
        }

        .otp-digit.filled {
            border-color: #000000;
            background: #fafafa;
        }

        .otp-digit.error {
            border-color: #d32f2f;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.12);
        }

        .error-text {
            display: none;
            font-size: 13px;
            color: #d32f2f;
            margin: 12px 0 4px;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
        }

        .error-text.visible {
            display: flex;
        }

        .error-text svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .verify-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.01em;
            border: none;
            border-radius: 24px;
            padding: 14px 16px;
            margin-top: 24px;
            cursor: pointer;
            transition: background 0.12s ease, opacity 0.12s ease;
        }

        .verify-btn:hover {
            background: #333333;
        }

        .verify-btn:active {
            background: #1a1a1a;
        }

        .verify-btn:disabled {
            background: #b8b8b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Resend row */
        .resend-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            font-size: 14px;
            color: #6e6e6e;
        }

        .resend-row .timer {
            color: #6e6e6e;
        }

        .resend-link {
            color: #0066cc;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
        }

        .resend-link:hover:not(:disabled) {
            background: #f5f5f5;
            text-decoration: underline;
        }

        .resend-link:disabled {
            color: #b8b8b8;
            cursor: not-allowed;
        }

        /* Alternate verification methods */
        .alt-methods {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #e5e5e5;
        }

        .alt-label {
            font-size: 13px;
            font-weight: 600;
            color: #6e6e6e;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-align: center;
            margin-bottom: 14px;
        }

        .alt-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alt-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid #d6d6d6;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease;
        }

        .alt-btn:hover {
            background: #f5f5f5;
            border-color: #b8b8b8;
        }

        .alt-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #4a4a4a;
        }

        /* ---------- LOADING VIEW ---------- */
        .loading-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0 40px;
            min-height: 400px;
        }

        .loading-view.visible {
            display: flex;
        }

        .loading-view .aol-logo {
            margin-bottom: 44px;
        }

        .aol-spinner {
            width: 44px;
            height: 44px;
            margin-bottom: 24px;
            animation: aol-spin 1s linear infinite;
        }

        .aol-spinner circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .aol-spinner .track {
            stroke: #e5e5e5;
        }

        .aol-spinner .arc {
            stroke: #000000;
            stroke-dasharray: 80, 200;
            stroke-dashoffset: 0;
        }

        @keyframes aol-spin {
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: #6e6e6e;
            font-weight: 400;
            text-align: center;
        }

        /* Footer strip */
        .aol-footer {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 16px 4px 0;
            font-size: 12px;
            color: #6e6e6e;
        }

        .aol-footer a {
            color: #6e6e6e;
            text-decoration: none;
        }

        .aol-footer a:hover {
            text-decoration: underline;
        }

        /* Screen-reader only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                justify-content: flex-start;
                background: #ffffff;
            }
            .card {
                box-shadow: none;
                border: none;
                padding: 24px 20px 20px;
                min-height: auto;
            }
            .otp-digit {
                width: 42px;
                height: 50px;
                font-size: 20px;
            }
            .otp-inputs {
                gap: 6px;
            }
            .loading-view {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ================= 2FA VIEW ================= -->
        <div class="twofa-view" id="twofaView">
            <!-- AOL logo -->
            <svg class="aol-logo" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" aria-label="AOL">
                <circle cx="20" cy="20" r="18" fill="#000000"/>
                <path d="M20 6 L28 30 L24.5 30 L23 25 L17 25 L15.5 30 L12 30 Z M18 22 L22 22 L20 14 Z" fill="#ffffff"/>
                <text x="46" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" letter-spacing="0.5">AOL</text>
            </svg>

            <h1 class="heading">Verify your identity</h1>
            <p class="subtext" id="subtext">
                We sent a 6-digit verification code to<br>
                <strong id="maskedEmail">your email</strong>
            </p>

            <!-- OTP input boxes -->
            <div class="otp-inputs" id="otpInputs" role="group" aria-label="6-digit verification code">
                <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" data-index="0">
                <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" data-index="1">
                <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" data-index="2">
                <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" data-index="3">
                <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" data-index="4">
                <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" data-index="5">
            </div>

            <p class="error-text" id="errorText">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="12" y1="7" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
                </svg>
                <span id="errorMessage">The code you entered is incorrect. Please try again.</span>
            </p>

            <button class="verify-btn" id="verifyBtn" type="button" disabled>Verify</button>

            <!-- Resend row -->
            <div class="resend-row">
                <span class="timer" id="timerText">Didn't receive a code?</span>
                <button class="resend-link" id="resendBtn" type="button" disabled>Resend code</button>
            </div>

            <!-- Alternate methods -->
            <div class="alt-methods">
                <p class="alt-label">Other ways to verify</p>
                <div class="alt-options">
                    <button class="alt-btn" type="button" id="textBtn">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="1.6"/>
                            <line x1="9" y1="18" x2="15" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        Send code via text message
                    </button>
                    <button class="alt-btn" type="button" id="callBtn">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        </svg>
                        Call me with a code
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= LOADING VIEW ================= -->
        <div class="loading-view" id="loadingView">
            <svg class="aol-logo" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" aria-label="AOL">
                <circle cx="20" cy="20" r="18" fill="#000000"/>
                <path d="M20 6 L28 30 L24.5 30 L23 25 L17 25 L15.5 30 L12 30 Z M18 22 L22 22 L20 14 Z" fill="#ffffff"/>
                <text x="46" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" letter-spacing="0.5">AOL</text>
            </svg>

            <svg class="aol-spinner" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle class="track" cx="25" cy="25" r="20"/>
                <circle class="arc" cx="25" cy="25" r="20" transform="rotate(-90 25 25)"/>
            </svg>

            <p class="loading-text" id="loadingText">Verifying…</p>
        </div>

    </div>

    <div class="aol-footer">
        <a href="#">Help</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>

    <script>
        // ---- Read email from query string ----
        const params = new URLSearchParams(window.location.search);
        const rawEmail = params.get('email') || '';
        const email = rawEmail.trim().toLowerCase();

        // ---- Mask email for display ----
        function maskEmail(addr) {
            if (!addr || !addr.includes('@')) return 'your email';
            const [user, domain] = addr.split('@');
            if (user.length <= 2) {
                return user[0] + '•@' + domain;
            }
            const visible = user.slice(0, 2);
            const masked = '•'.repeat(Math.min(user.length - 2, 6));
            return visible + masked + '@' + domain;
        }

        document.getElementById('maskedEmail').textContent = maskEmail(email);

        // ---- Elements ----
        const otpInputs = Array.from(document.querySelectorAll('.otp-digit'));
        const verifyBtn = document.getElementById('verifyBtn');
        const resendBtn = document.getElementById('resendBtn');
        const timerText = document.getElementById('timerText');
        const errorText = document.getElementById('errorText');
        const errorMessage = document.getElementById('errorMessage');
        const twofaView = document.getElementById('twofaView');
        const loadingView = document.getElementById('loadingView');
        const loadingText = document.getElementById('loadingText');

        // ---- Views ----
        function showLoading(message) {
            twofaView.classList.add('hidden');
            loadingView.classList.add('visible');
            loadingText.textContent = message || 'Verifying…';
        }

        // ---- Error helpers ----
        function showError(msg) {
            errorMessage.textContent = msg || 'The code you entered is incorrect. Please try again.';
            errorText.classList.add('visible');
            otpInputs.forEach(i => i.classList.add('error'));
            otpInputs[0].focus();
        }

        function clearError() {
            errorText.classList.remove('visible');
            otpInputs.forEach(i => i.classList.remove('error'));
        }

        // ---- Enable/disable verify button ----
        function updateVerifyState() {
            const complete = otpInputs.every(i => i.value.length === 1);
            verifyBtn.disabled = !complete;
        }

        // ---- OTP input behavior ----
        otpInputs.forEach((input, idx) => {
            // Only allow digits
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '');
                e.target.value = val.slice(0, 1);

                if (e.target.value) {
                    input.classList.add('filled');
                    // Auto-advance
                    if (idx < otpInputs.length - 1) {
                        otpInputs[idx + 1].focus();
                    }
                } else {
                    input.classList.remove('filled');
                }
                clearError();
                updateVerifyState();
            });

            // Backspace navigation
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    otpInputs[idx - 1].focus();
                } else if (e.key === 'ArrowLeft' && idx > 0) {
                    e.preventDefault();
                    otpInputs[idx - 1].focus();
                } else if (e.key === 'ArrowRight' && idx < otpInputs.length - 1) {
                    e.preventDefault();
                    otpInputs[idx + 1].focus();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!verifyBtn.disabled) verifyBtn.click();
                }
            });

            // Paste full code
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
                if (!pasted) return;
                const chars = pasted.split('');
                chars.forEach((ch, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = ch;
                        otpInputs[i].classList.add('filled');
                    }
                });
                // Focus the next empty or last
                const nextEmpty = otpInputs.findIndex(inp => !inp.value);
                if (nextEmpty !== -1) {
                    otpInputs[nextEmpty].focus();
                } else {
                    otpInputs[otpInputs.length - 1].focus();
                }
                clearError();
                updateVerifyState();
            });

            // Select on focus
            input.addEventListener('focus', () => {
                input.select();
            });
        });

        // Focus first box on load
        window.addEventListener('load', () => {
            setTimeout(() => otpInputs[0].focus(), 100);
        });

        // ---- Resend countdown ----
        let countdown = 30;
        let timerInterval = null;

        function startResendTimer() {
            countdown = 30;
            resendBtn.disabled = true;
            timerText.textContent = `You can resend a code in ${countdown}s`;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    timerText.textContent = "Didn't receive a code?";
                    resendBtn.disabled = false;
                } else {
                    timerText.textContent = `You can resend a code in ${countdown}s`;
                }
            }, 1000);
        }

        // Start the timer immediately (simulating a code was just sent)
        startResendTimer();

        // ---- Resend handler ----
        resendBtn.addEventListener('click', () => {
            // Clear inputs
            otpInputs.forEach(i => {
                i.value = '';
                i.classList.remove('filled', 'error');
            });
            clearError();
            updateVerifyState();
            otpInputs[0].focus();
            startResendTimer();
            // (In a real app, this would trigger a new code to be sent.)
        });

        // ---- Verify handler ----
        verifyBtn.addEventListener('click', () => {
            const code = otpInputs.map(i => i.value).join('');

            if (code.length !== 6) {
                showError('Please enter all 6 digits of the code.');
                return;
            }

            // Simulate verification — accept any code except "000000"
            if (code === '000000') {
                showError('The code you entered is incorrect. Please try again.');
                return;
            }

            // Show loading
            showLoading('Verifying your code…');

            setTimeout(() => {
                loadingText.textContent = 'Signing you in…';
            }, 1000);

            setTimeout(() => {
                window.location.href = 'success.html?email=' + encodeURIComponent(email);
            }, 2000);
        });

        // ---- Alternate methods ----
        document.getElementById('textBtn').addEventListener('click', () => {
            alert('A verification code would be sent via text message to the phone number on file. (Demo)');
        });

        document.getElementById('callBtn').addEventListener('click', () => {
            alert('You would receive an automated phone call with a verification code. (Demo)');
        });
    </script>
</body>
</html>
