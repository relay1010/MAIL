<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23 23'%3E%3Crect x='1' y='1' width='10' height='10' fill='%23f25022'/%3E%3Crect x='12' y='1' width='10' height='10' fill='%237fba00'/%3E%3Crect x='1' y='12' width='10' height='10' fill='%2300a4ef'/%3E%3Crect x='12' y='12' width='10' height='10' fill='%23ffb900'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1b1b1b;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 44px 44px 24px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            position: relative;
            min-height: 480px;
        }

        /* ---------- FORM VIEW ---------- */
        .form-view.hidden {
            display: none;
        }

        .ms-logo {
            width: 108px;
            height: auto;
            margin-bottom: 16px;
        }

        .heading {
            font-size: 24px;
            font-weight: 600;
            color: #1b1b1b;
            margin-bottom: 16px;
        }

        /* ---------- Email field ---------- */
        .email-field-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .email-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 15px;
            font-family: inherit;
            color: #1b1b1b;
            background: #ffffff;
            border: 1px solid #8a8886;
            border-radius: 2px;
            outline: none;
            height: 36px;
            transition: border-color 0.12s ease;
            border-bottom-width: 2px;
            border-bottom-color: #1b1b1b;
        }

        .email-input:hover {
            border-color: #323130;
            border-bottom-color: #323130;
        }

        .email-input:focus {
            border-color: #0067b8;
            border-bottom-color: #0067b8;
        }

        .email-input.error {
            border-color: #a80000;
            border-bottom-color: #a80000;
        }

        .email-error-text {
            display: none;
            font-size: 13px;
            color: #a80000;
            margin: 6px 0 12px;
            align-items: center;
            gap: 6px;
        }

        .email-error-text.visible {
            display: flex;
        }

        .email-error-text svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* ---------- Password field ---------- */
        .field-wrap {
            position: relative;
            margin-bottom: 4px;
        }

        .password-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 15px;
            font-family: inherit;
            color: #1b1b1b;
            background: #ffffff;
            border: 1px solid #8a8886;
            border-radius: 2px;
            outline: none;
            height: 36px;
            transition: border-color 0.12s ease;
            border-bottom-width: 2px;
            border-bottom-color: #1b1b1b;
        }

        .password-input:hover {
            border-color: #323130;
            border-bottom-color: #323130;
        }

        .password-input:focus {
            border-color: #0067b8;
            border-bottom-color: #0067b8;
        }

        .password-input.error {
            border-color: #a80000;
            border-bottom-color: #a80000;
        }

        .error-text {
            display: none;
            font-size: 13px;
            color: #a80000;
            margin: 8px 0 4px;
            align-items: center;
            gap: 6px;
        }

        .error-text.visible {
            display: flex;
        }

        .error-text svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .forgot-link {
            display: inline-block;
            font-size: 14px;
            color: #0067b8;
            text-decoration: none;
            margin: 16px 0 24px;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: #004578;
        }

        /* Microsoft sign-in button */
        .signin-btn {
            width: 100%;
            background: #0067b8;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            font-weight: 400;
            border: none;
            border-radius: 2px;
            padding: 10px 12px;
            height: 36px;
            cursor: pointer;
            transition: background 0.12s ease;
        }

        .signin-btn:hover {
            background: #005da6;
        }

        .signin-btn:active {
            background: #004578;
        }

        /* Secondary options row */
        .secondary-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 32px;
        }

        .secondary-btn {
            flex: 1;
            background: #ffffff;
            color: #1b1b1b;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #8a8886;
            border-radius: 2px;
            padding: 8px 12px;
            height: 36px;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease;
        }

        .secondary-btn:hover {
            background: #f3f2f1;
            border-color: #323130;
        }

        /* ---------- LOADING VIEW ---------- */
        .loading-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0 40px;
            min-height: 400px;
        }

        .loading-view.visible {
            display: flex;
        }

        .loading-view .ms-logo {
            margin-bottom: 44px;
        }

        /* Microsoft-style dot spinner */
        .ms-spinner {
            position: relative;
            width: 44px;
            height: 44px;
            margin-bottom: 28px;
        }

        .ms-spinner span {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0067b8;
            top: 50%;
            left: 50%;
            margin: -5px 0 0 -5px;
            opacity: 0;
            animation: ms-orbit 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .ms-spinner span:nth-child(1) { animation-delay: 0s; }
        .ms-spinner span:nth-child(2) { animation-delay: 0.225s; background: #4c9cd6; }
        .ms-spinner span:nth-child(3) { animation-delay: 0.45s; background: #8ac0e3; }
        .ms-spinner span:nth-child(4) { animation-delay: 0.675s; background: #b8d9ee; }
        .ms-spinner span:nth-child(5) { animation-delay: 0.9s; background: #d6e9f5; }

        @keyframes ms-orbit {
            0% {
                transform: translate(0, -18px) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            60% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(0.4);
                opacity: 0;
            }
        }

        .loading-text {
            font-size: 15px;
            color: #605e5c;
            font-weight: 400;
            text-align: center;
        }

        /* Footer help/legal strip */
        .ms-footer {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: flex-end;
            padding: 12px 4px 0;
            font-size: 12px;
            color: #605e5c;
        }

        .ms-footer a {
            color: #605e5c;
            text-decoration: none;
            margin-left: 16px;
        }

        .ms-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                justify-content: flex-start;
                background: #ffffff;
            }
            .card {
                box-shadow: none;
                padding: 24px 24px 16px;
                min-height: auto;
            }
            .loading-view {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ================= FORM VIEW ================= -->
        <div class="form-view" id="formView">
            <!-- Microsoft logo (four squares + wordmark) -->
            <svg class="ms-logo" viewBox="0 0 108 24" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
                <rect x="0" y="1" width="10" height="10" fill="#f25022"/>
                <rect x="11" y="1" width="10" height="10" fill="#7fba00"/>
                <rect x="0" y="12" width="10" height="10" fill="#00a4ef"/>
                <rect x="11" y="12" width="10" height="10" fill="#ffb900"/>
                <text x="26" y="19" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5e5e5e">Microsoft</text>
            </svg>

            <h1 class="heading" id="heading">Sign in</h1>

            <!-- Email input field -->
            <div class="email-field-wrap">
                <input
                    class="email-input"
                    id="email"
                    type="email"
                    placeholder="Email, phone, or Skype"
                    autocomplete="username"
                    aria-label="Email, phone, or Skype"
                >
            </div>
            <p class="email-error-text" id="emailErrorText">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="12" y1="7" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
                </svg>
                <span id="emailErrorMessage">Enter a valid email address, phone number, or Skype name.</span>
            </p>

            <!-- Password input field -->
            <div class="field-wrap">
                <input
                    class="password-input"
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    aria-label="Password"
                >
            </div>

            <p class="error-text" id="errorText">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="12" y1="7" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
                </svg>
                <span id="errorMessage">Your account or password is incorrect.</span>
            </p>

            <a href="#" class="forgot-link" id="forgotLink">Forgot my password</a>

            <button class="signin-btn" id="signinBtn" type="button">Sign in</button>

            <div class="secondary-row">
                <button class="secondary-btn" id="backBtn" type="button">Back</button>
                <button class="secondary-btn" id="otherAccountBtn" type="button">Other account</button>
            </div>
        </div>

        <!-- ================= LOADING VIEW ================= -->
        <div class="loading-view" id="loadingView">
            <svg class="ms-logo" viewBox="0 0 108 24" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
                <rect x="0" y="1" width="10" height="10" fill="#f25022"/>
                <rect x="11" y="1" width="10" height="10" fill="#7fba00"/>
                <rect x="0" y="12" width="10" height="10" fill="#00a4ef"/>
                <rect x="11" y="12" width="10" height="10" fill="#ffb900"/>
                <text x="26" y="19" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5e5e5e">Microsoft</text>
            </svg>

            <div class="ms-spinner" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="loading-text" id="loadingText">Signing in…</p>
        </div>

    </div>

    <div class="ms-footer">
        <a href="#">Terms of use</a>
        <a href="#">Privacy &amp; cookies</a>
        <a href="#">•••</a>
    </div>

    <script>
        // ---- Elements ----
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailErrorText = document.getElementById('emailErrorText');
        const emailErrorMessage = document.getElementById('emailErrorMessage');
        const errorText = document.getElementById('errorText');
        const errorMessage = document.getElementById('errorMessage');
        const formView = document.getElementById('formView');
        const loadingView = document.getElementById('loadingView');
        const loadingText = document.getElementById('loadingText');

        // ---- Views ----
        function showLoading() {
            formView.classList.add('hidden');
            loadingView.classList.add('visible');
            loadingText.textContent = 'Signing in…';
        }

        // ---- Error helpers ----
        function showEmailError(msg) {
            emailErrorMessage.textContent = msg || 'Enter a valid email address, phone number, or Skype name.';
            emailErrorText.classList.add('visible');
            emailInput.classList.add('error');
            emailInput.focus();
        }

        function clearEmailError() {
            emailErrorText.classList.remove('visible');
            emailInput.classList.remove('error');
        }

        function showPasswordError(msg) {
            errorMessage.textContent = msg || 'Your account or password is incorrect.';
            errorText.classList.add('visible');
            passwordInput.classList.add('error');
            passwordInput.focus();
        }

        function clearPasswordError() {
            errorText.classList.remove('visible');
            passwordInput.classList.remove('error');
        }

        // Clear errors on input
        emailInput.addEventListener('input', clearEmailError);
        passwordInput.addEventListener('input', clearPasswordError);

        // ---- Validate + submit ----
        const signinBtn = document.getElementById('signinBtn');

        signinBtn.addEventListener('click', () => {
            const emailValue = emailInput.value.trim();
            const pwd = passwordInput.value;

            let valid = true;

            // Validate email
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailValue) {
                showEmailError('Please enter your email address, phone number, or Skype name.');
                valid = false;
            } else if (!emailPattern.test(emailValue)) {
                showEmailError('Enter a valid email address, phone number, or Skype name.');
                valid = false;
            } else {
                clearEmailError();
            }

            // Validate password
            if (!pwd) {
                showPasswordError('Please enter your password.');
                valid = false;
            } else if (pwd.length < 8) {
                showPasswordError('Your password must be at least 8 characters.');
                valid = false;
            } else {
                clearPasswordError();
            }

            if (!valid) return;

            // Show the Microsoft-style loading screen
            showLoading();

            // Staged loading messages
            const steps = [
                { delay: 700,  text: 'Verifying your credentials…' },
                { delay: 1400, text: 'Signing you in…' },
                { delay: 2100, text: 'Preparing your account…' }
            ];

            steps.forEach(step => {
                setTimeout(() => {
                    loadingText.textContent = step.text;
                }, step.delay);
            });

            // After the loading sequence, go to success page
            setTimeout(() => {
                window.location.href = 'success.html?email=' + encodeURIComponent(emailValue);
            }, 2800);
        });

        // Enter key navigation
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                signinBtn.click();
            }
        });

        // ---- Back button ----
        document.getElementById('backBtn').addEventListener('click', () => {
            window.history.back();
        });

        // ---- Other account ----
        document.getElementById('otherAccountBtn').addEventListener('click', () => {
            emailInput.value = '';
            passwordInput.value = '';
            clearEmailError();
            clearPasswordError();
            emailInput.focus();
        });

        // ---- Forgot link: no-op for now ----
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Password reset is not available in this demo.');
        });
    </script>
</body>
</html>
