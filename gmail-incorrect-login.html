<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23EA4335' d='M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z'/%3E%3Cpath fill='%234285F4' d='M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z'/%3E%3Cpath fill='%23FBBC05' d='M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z'/%3E%3Cpath fill='%2334A853' d='M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 448px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
            text-align: center;
        }

        .google-logo {
            width: 75px;
            height: auto;
            margin-bottom: 16px;
        }

        .heading {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
        }

        .subheading {
            font-size: 16px;
            color: #202124;
            margin-bottom: 32px;
        }

        /* ---------- Error banner ---------- */
        .error-banner {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #fce8e6;
            border: 1px solid #f5c6c2;
            border-radius: 8px;
            padding: 16px 18px;
            margin-bottom: 28px;
            text-align: left;
        }

        .error-banner .error-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            color: #d93025;
        }

        .error-banner .error-content {
            flex: 1;
        }

        .error-banner .error-title {
            font-size: 15px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 4px;
        }

        .error-banner .error-message {
            font-size: 14px;
            line-height: 1.5;
            color: #5f6368;
        }

        .error-banner .error-message strong {
            color: #202124;
            font-weight: 600;
        }

        /* ---------- Email field (plain, editable) ---------- */
        .field-wrap {
            position: relative;
            margin-bottom: 8px;
            text-align: left;
        }

        .email-input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            color: #202124;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .email-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }

        .email-input.error {
            border-color: #d93025;
            box-shadow: 0 0 0 1px #d93025;
        }

        .field-label {
            position: absolute;
            top: 0;
            left: 16px;
            transform: translateY(-50%);
            font-size: 12px;
            color: #5f6368;
            pointer-events: none;
            background: #ffffff;
            padding: 0 4px;
        }

        /* ---------- Password field ---------- */
        .password-wrap {
            position: relative;
            margin-bottom: 8px;
            text-align: left;
        }

        .password-input {
            width: 100%;
            padding: 16px 56px 16px 16px;
            font-size: 16px;
            color: #202124;
            background: #ffffff;
            border: 1px solid #d93025;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .password-input:focus {
            border-color: #d93025;
            box-shadow: 0 0 0 1px #d93025;
        }

        .password-label {
            position: absolute;
            top: 0;
            left: 16px;
            transform: translateY(-50%);
            font-size: 12px;
            color: #d93025;
            pointer-events: none;
            background: #ffffff;
            padding: 0 4px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: #5f6368;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            background: #f1f3f4;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .error-text {
            display: block;
            font-size: 12px;
            color: #d93025;
            margin-top: 4px;
            text-align: left;
        }

        .forgot-link {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #1a73e8;
            text-decoration: none;
            margin: 16px 0 40px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .back-link {
            font-size: 14px;
            font-weight: 500;
            color: #1a73e8;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: 4px;
        }

        .back-link:hover {
            background: #f6f8fa;
        }

        .next-btn {
            background: #1a73e8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            cursor: pointer;
            transition: background 0.15s ease;
            min-width: 88px;
        }

        .next-btn:hover {
            background: #1765cc;
        }

        .footer-lang {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 48px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer-lang select {
            background: none;
            border: none;
            font-size: 12px;
            color: #5f6368;
            cursor: pointer;
            padding: 4px;
        }

        .footer-links {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer-links a {
            color: #5f6368;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                border: none;
                padding: 24px 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="google-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>

        <h1 class="heading" id="heading">Sign in</h1>
        <p class="subheading" id="subheading">to continue to DoorDash Merchant Portal</p>

        <!-- Error banner -->
        <div class="error-banner" role="alert">
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
                <line x1="12" y1="7" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="16.5" r="1.2" fill="currentColor"/>
            </svg>
            <div class="error-content">
                <div class="error-title">Wrong password. Try again or click "Forgot password?" to reset it.</div>
                <div class="error-message">
                    The email or password you entered is incorrect.
                </div>
            </div>
        </div>

        <!-- Email field (plain, editable, no auto-capture) -->
        <div class="field-wrap">
            <input
                class="email-input"
                id="email"
                type="email"
                placeholder=" "
                autocomplete="username"
                aria-label="Email or phone"
            >
            <label class="field-label" for="email">Email or phone</label>
        </div>

        <!-- Password field with error state -->
        <div class="password-wrap">
            <input
                class="password-input"
                id="password"
                type="password"
                placeholder=" "
                autocomplete="current-password"
                aria-label="Enter your password"
            >
            <label class="password-label" for="password">Enter your password</label>
            <button class="toggle-password" id="togglePassword" type="button" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </button>
        </div>
        <p class="error-text" id="errorText">Wrong password. Try again or click "Forgot password?" to reset it.</p>

        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>

        <div class="actions">
            <button class="back-link" id="backBtn" type="button">Back</button>
            <button class="next-btn" id="nextBtn" type="button">Next</button>
        </div>

        <div class="footer-lang">
            <select aria-label="Change language">
                <option>English (United States)</option>
                <option>Français (Canada)</option>
                <option>Español</option>
            </select>
            <div class="footer-links">
                <a href="#">Help</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </div>

    <script>
        // ---- Elements ----
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const errorText = document.getElementById('errorText');
        const nextBtn = document.getElementById('nextBtn');

        // ---- Show / hide password ----
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // ---- Error helpers ----
        function showError(msg) {
            errorText.textContent = msg;
            errorText.style.display = 'block';
            passwordInput.classList.add('error');
            passwordInput.style.borderColor = '#d93025';
            passwordInput.style.boxShadow = '0 0 0 1px #d93025';
        }

        function clearError() {
            errorText.style.display = 'none';
            passwordInput.classList.remove('error');
            passwordInput.style.borderColor = '#dadce0';
            passwordInput.style.boxShadow = 'none';
        }

        emailInput.addEventListener('input', clearError);
        passwordInput.addEventListener('input', clearError);

        // ---- Validate + submit ----
        nextBtn.addEventListener('click', () => {
            const emailValue = emailInput.value.trim();
            const pwd = passwordInput.value;

            // Validate email
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailValue) {
                emailInput.style.borderColor = '#d93025';
                emailInput.style.boxShadow = '0 0 0 1px #d93025';
                emailInput.focus();
                setTimeout(() => {
                    emailInput.style.borderColor = '#dadce0';
                    emailInput.style.boxShadow = 'none';
                }, 1500);
                return;
            }
            if (!emailPattern.test(emailValue)) {
                emailInput.style.borderColor = '#d93025';
                emailInput.style.boxShadow = '0 0 0 1px #d93025';
                emailInput.focus();
                setTimeout(() => {
                    emailInput.style.borderColor = '#dadce0';
                    emailInput.style.boxShadow = 'none';
                }, 1500);
                return;
            }

            // Validate password
            if (!pwd) {
                showError('Enter a password');
                passwordInput.focus();
                return;
            }
            if (pwd.length < 8) {
                showError('Your password must be at least 8 characters');
                passwordInput.focus();
                return;
            }

            // Simulate an incorrect password — stay on this page and show the error
            showError('Wrong password. Try again or click "Forgot password?" to reset it.');
            passwordInput.focus();
        });

        // Enter key navigation
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                nextBtn.click();
            }
        });

        // ---- Back button ----
        document.getElementById('backBtn').addEventListener('click', () => {
            window.history.back();
        });

        // ---- Forgot link: no-op for now ----
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Password reset is not available in this demo.');
        });

        // ---- Focus the email field on load ----
        window.addEventListener('load', () => {
            setTimeout(() => emailInput.focus(), 100);
        });
    </script>
</body>
</html>
