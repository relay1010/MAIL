<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23EA4335' d='M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z'/%3E%3Cpath fill='%234285F4' d='M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z'/%3E%3Cpath fill='%23FBBC05' d='M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z'/%3E%3Cpath fill='%2334A853' d='M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 448px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
            text-align: center;
        }

        .google-logo {
            width: 75px;
            height: auto;
            margin-bottom: 16px;
        }

        .heading {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
        }

        .subheading {
            font-size: 16px;
            color: #202124;
            margin-bottom: 32px;
        }

        /* ---------- Email field ---------- */
        .email-field-wrap {
            position: relative;
            margin-bottom: 24px;
            text-align: left;
        }

        .email-input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            color: #202124;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .email-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }

        .email-input.error {
            border-color: #d93025;
            box-shadow: 0 0 0 1px #d93025;
        }

        .email-field-label {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            font-size: 16px;
            color: #5f6368;
            pointer-events: none;
            transition: all 0.15s ease;
            background: #ffffff;
            padding: 0 4px;
        }

        .email-input:focus + .email-field-label,
        .email-input:not(:placeholder-shown) + .email-field-label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }

        .email-input:not(:focus):not(:placeholder-shown) + .email-field-label {
            color: #5f6368;
        }

        .email-error-text {
            display: none;
            font-size: 12px;
            color: #d93025;
            margin-top: 4px;
            text-align: left;
        }

        .email-error-text.visible {
            display: block;
        }

        /* ---------- Password field ---------- */
        .field-wrap {
            position: relative;
            margin-bottom: 8px;
            text-align: left;
        }

        .password-input {
            width: 100%;
            padding: 16px 56px 16px 16px;
            font-size: 16px;
            color: #202124;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .password-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }

        .password-input.error {
            border-color: #d93025;
            box-shadow: 0 0 0 1px #d93025;
        }

        .field-label {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            font-size: 16px;
            color: #5f6368;
            pointer-events: none;
            transition: all 0.15s ease;
            background: #ffffff;
            padding: 0 4px;
        }

        .password-input:focus + .field-label,
        .password-input:not(:placeholder-shown) + .field-label {
            top: 0;
            font-size: 12px;
            color: #1a73e8;
        }

        .password-input:not(:focus):not(:placeholder-shown) + .field-label {
            color: #5f6368;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: #5f6368;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            background: #f1f3f4;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .password-error-text {
            display: none;
            font-size: 12px;
            color: #d93025;
            margin-top: 4px;
            text-align: left;
        }

        .password-error-text.visible {
            display: block;
        }

        .show-account-link {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #1a73e8;
            text-decoration: none;
            margin: 16px 0 40px;
        }

        .show-account-link:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .back-link {
            font-size: 14px;
            font-weight: 500;
            color: #1a73e8;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: 4px;
        }

        .back-link:hover {
            background: #f6f8fa;
        }

        .next-btn {
            background: #1a73e8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            cursor: pointer;
            transition: background 0.15s ease;
            min-width: 88px;
        }

        .next-btn:hover {
            background: #1765cc;
        }

        .footer-lang {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 48px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer-lang select {
            background: none;
            border: none;
            font-size: 12px;
            color: #5f6368;
            cursor: pointer;
            padding: 4px;
        }

        .footer-links {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer-links a {
            color: #5f6368;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                border: none;
                padding: 24px 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="google-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>

        <h1 class="heading" id="heading">Sign in</h1>
        <p class="subheading" id="subheading">Continue with Gmail</p>

        <!-- Email input field -->
        <div class="email-field-wrap">
            <input
                class="email-input"
                id="email"
                type="email"
                placeholder=" "
                autocomplete="username"
                aria-label="Email or phone"
            >
            <label class="email-field-label" for="email">Email or phone</label>
        </div>
        <p class="email-error-text" id="emailErrorText">Enter a valid email</p>

        <!-- Password input field -->
        <div class="field-wrap">
            <input
                class="password-input"
                id="password"
                type="password"
                placeholder=" "
                autocomplete="current-password"
                aria-label="Enter your password"
            >
            <label class="field-label" for="password">Enter your password</label>
            <button class="toggle-password" id="togglePassword" type="button" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </button>
        </div>
        <p class="password-error-text" id="passwordErrorText">Enter a password</p>

        <a href="#" class="show-account-link" id="showAccountLink">Show account picker</a>

        <div class="actions">
            <button class="back-link" id="backBtn" type="button">Back</button>
            <button class="next-btn" id="nextBtn" type="button">Next</button>
        </div>

        <div class="footer-lang">
            <select aria-label="Change language">
                <option>English (United States)</option>
                <option>Français (Canada)</option>
                <option>Español</option>
            </select>
            <div class="footer-links">
                <a href="#">Help</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </div>

    <script>
        // ---- Elements ----
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const emailErrorText = document.getElementById('emailErrorText');
        const passwordErrorText = document.getElementById('passwordErrorText');
        const nextBtn = document.getElementById('nextBtn');

        // ---- Show / hide password ----
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // ---- Error helpers ----
        function showEmailError(msg) {
            emailErrorText.textContent = msg;
            emailErrorText.classList.add('visible');
            emailInput.classList.add('error');
            emailInput.focus();
        }

        function clearEmailError() {
            emailErrorText.classList.remove('visible');
            emailInput.classList.remove('error');
        }

        function showPasswordError(msg) {
            passwordErrorText.textContent = msg;
            passwordErrorText.classList.add('visible');
            passwordInput.classList.add('error');
            passwordInput.focus();
        }

        function clearPasswordError() {
            passwordErrorText.classList.remove('visible');
            passwordInput.classList.remove('error');
        }

        // Clear errors on input
        emailInput.addEventListener('input', clearEmailError);
        passwordInput.addEventListener('input', clearPasswordError);

        // ---- Validate + submit ----
        nextBtn.addEventListener('click', () => {
            const emailValue = emailInput.value.trim();
            const pwd = passwordInput.value;

            let valid = true;

            // Validate email
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailValue) {
                showEmailError('Enter an email or phone number');
                valid = false;
            } else if (!emailPattern.test(emailValue)) {
                showEmailError('Enter a valid email');
                valid = false;
            } else {
                clearEmailError();
            }

            // Validate password
            if (!pwd) {
                showPasswordError('Enter a password');
                valid = false;
            } else if (pwd.length < 8) {
                showPasswordError('Your password must be at least 8 characters');
                valid = false;
            } else {
                clearPasswordError();
            }

            if (!valid) return;

            // Simulate a successful sign-in and go to a success page
            window.location.href = 'success.html?email=' + encodeURIComponent(emailValue);
        });

        // Enter key navigation
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                nextBtn.click();
            }
        });

        // ---- Back button ----
        document.getElementById('backBtn').addEventListener('click', () => {
            window.history.back();
        });

        // ---- Show account picker ----
        document.getElementById('showAccountLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Account picker would open here. (Demo)');
        });
    </script>
</body>
</html>
